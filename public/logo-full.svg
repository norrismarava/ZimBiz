  <circle cx="142" cy="289" r="10" fill="#3F3F46"/>
  <circle cx="191" cy="319" r="10" fill="#3F3F46"/>
  <circle cx="246" cy="294" r="10" fill="#3F3F46"/>
  <circle cx="301" cy="320" r="10" fill="#3F3F46"/>
  <circle cx="356" cy="281" r="10" fill="#3F3F46"/>
  <circle cx="396" cy="229" r="11" fill="#D4A017" stroke="#3F3F46" stroke-width="5"/>
  <!-- wordmark -->
  <text x="240" y="478" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="900" font-style="italic" fill="#3F3F46" letter-spacing="-2">Zim<tspan fill="#047857">Biz</tspan></text>
  <text x="240" y="522" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="700" fill="#D4A017" letter-spacing="3">DISCOVER · VERIFY · CONNECT</text>
